services:
  manager-control:
    build:
      context: ..
      dockerfile: services/manager-control/Dockerfile
    container_name: openclaw-manager-control
    restart: unless-stopped
    env_file:
      - ../config/openclaw-manager.env
    volumes:
      - ${OPENCLAW_PUBLIC_DIR:-/data/docker/openclaw-public}:${OPENCLAW_PUBLIC_DIR:-/data/docker/openclaw-public}
      - ${HERMES_AUTH_BRIDGE_SIGNING_KEY_HOST_FILE:?required}:/run/secrets/hermes-auth-bridge-ed25519.pem:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=2)"
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - manager-net

  manager-executor:
    build:
      context: ..
      dockerfile: services/manager-executor/Dockerfile
    container_name: openclaw-manager-executor
    restart: unless-stopped
    depends_on:
      manager-control:
        condition: service_healthy
    env_file:
      - ../config/openclaw-manager.env
    environment:
      OPENCLAW_MANAGER_DIR: /opt/openclaw-manager
      OPENCLAW_PUBLIC_DIR: ${OPENCLAW_PUBLIC_DIR:-/data/docker/openclaw-public}
      NGINX_USERS_CONF_DIR: ${NGINX_USERS_CONF_DIR:-/data/docker/nginx/conf}
      HERMES_AUTH_BRIDGE_CA_FILE: /run/secrets/hermes-auth-bridge-ca.crt
    volumes:
      - ..:/opt/openclaw-manager:ro
      - ${OPENCLAW_PUBLIC_DIR:-/data/docker/openclaw-public}:${OPENCLAW_PUBLIC_DIR:-/data/docker/openclaw-public}
      - ${NGINX_COMPOSE_DIR:-/data/docker/nginx/compose}:${NGINX_COMPOSE_DIR:-/data/docker/nginx/compose}
      - ${NGINX_USERS_CONF_DIR:-/data/docker/nginx/conf}:${NGINX_USERS_CONF_DIR:-/data/docker/nginx/conf}
      - ${NGINX_AUTH_DIR:-/data/docker/nginx/auth}:${NGINX_AUTH_DIR:-/data/docker/nginx/auth}
      - ${HERMES_AUTH_BRIDGE_CA_HOST_FILE:?required}:/run/secrets/hermes-auth-bridge-ca.crt:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import os,ssl; p=os.environ['HERMES_AUTH_BRIDGE_CA_FILE']; assert os.path.isfile(p) and os.access(p, os.R_OK); ssl.create_default_context(cafile=p)"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - manager-net

  manager-executor-api:
    build:
      context: ..
      dockerfile: services/manager-executor/Dockerfile
    container_name: openclaw-manager-executor-api
    restart: unless-stopped
    command: ["gunicorn", "--bind", "0.0.0.0:8083", "--workers", "1", "--timeout", "120", "api:app"]
    depends_on:
      manager-control:
        condition: service_healthy
    env_file:
      - ../config/openclaw-manager.env
    environment:
      OPENCLAW_MANAGER_DIR: /opt/openclaw-manager
      OPENCLAW_PUBLIC_DIR: ${OPENCLAW_PUBLIC_DIR:-/data/docker/openclaw-public}
    volumes:
      - ..:/opt/openclaw-manager:ro
      - ${OPENCLAW_PUBLIC_DIR:-/data/docker/openclaw-public}:${OPENCLAW_PUBLIC_DIR:-/data/docker/openclaw-public}
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - manager-net

  manager-user-web:
    build: ./manager-web
    container_name: openclaw-manager-user-web
    restart: unless-stopped
    depends_on:
      manager-control:
        condition: service_healthy
    env_file:
      - ../config/openclaw-manager.env
    environment:
      MANAGER_WEB_ROLE: user
    command: ["python", "user_app.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - manager-net

  manager-admin-web:
    build: ./manager-web
    container_name: openclaw-manager-admin-web
    restart: unless-stopped
    depends_on:
      manager-control:
        condition: service_healthy
    env_file:
      - ../config/openclaw-manager.env
    environment:
      MANAGER_WEB_ROLE: admin
    command: ["python", "admin_app.py"]
    ports:
      - "127.0.0.1:18083:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - manager-net

  instance-auth-proxy:
    build: ./manager-web
    container_name: openclaw-instance-auth-proxy
    restart: unless-stopped
    depends_on:
      manager-control:
        condition: service_healthy
    env_file:
      - ../config/openclaw-manager.env
    command: ["python", "instance_auth_app.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8084/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - manager-net
      - instance-auth-net

  pdf-extract-text:
    build: ./pdf-extract-text
    container_name: pdf-extract-text
    restart: unless-stopped

    networks:
      - manager-net

  model-proxy:
    build:
      context: ..
      dockerfile: services/model-proxy/Dockerfile
    container_name: openclaw-model-proxy
    restart: unless-stopped
    env_file:
      - ../config/openclaw-manager.env
    volumes:
      - ${MODEL_PROXY_TOKEN_DIR:-/data/docker/openclaw-public/model-proxy-tokens}:${MODEL_PROXY_TOKEN_DIR:-/data/docker/openclaw-public/model-proxy-tokens}:ro
    networks:
      - manager-net


networks:
  manager-net:
    external: true
  instance-auth-net:
    external: true
