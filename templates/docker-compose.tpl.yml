version: "3.9"

services:

  openclaw-{{SERVICE_ID}}:
    image: ghcr.io/openclaw/openclaw:{{VERSION}}
    container_name: openclaw_{{USER_ID}}
    restart: unless-stopped

    user: "1000:1000"

    expose:
      - "18789"

    volumes:
      - {{DATA_PATH}}/config:/home/node/.openclaw
      - {{DATA_PATH}}/workspaces:/workspaces
      - {{DATA_PATH}}/workspace:/home/node/.openclaw/workspace
      - {{DATA_PATH}}/uploads:/workspaces/uploads
      - {{DATA_PATH}}/skills:/workspaces/main/skills
      - {{DATA_PATH}}/extensions:/home/node/.openclaw/extensions
      - /etc/localtime:/etc/localtime:ro

    security_opt:
      - no-new-privileges:true

    environment:
      - TZ={{TZ}}
      - OPENCLAW_GATEWAY_TOKEN={{GATEWAY_TOKEN}}

    cap_drop:
      - ALL

    networks:
      - tenant-net

networks:
  tenant-net:
    name: {{TENANT_NETWORK}}
    external: true
